</span><br><span class="line">482</span><br><span class="line">483</span><br><span class="line">484</span><br><span class="line">485</span><br><span class="line">486</span><br><span class="line">487</span><br><span class="line">488</span><br><span class="line">489</span><br></pre></td><td class="code"><pre><code class="hljs python"><span class="hljs-keyword">import</span> os<br><span class="hljs-keyword">import</span> urllib<br><span class="hljs-keyword">import</span> traceback<br><span class="hljs-keyword">import</span> time<br><span class="hljs-keyword">import</span> sys<br><span class="hljs-keyword">import</span> numpy <span class="hljs-keyword">as</span> np<br><span class="hljs-keyword">import</span> cv2<br><span class="hljs-keyword">from</span> rknn.api <span class="hljs-keyword">import</span> RKNN<br><br><span class="hljs-comment"># Model from https://github.com/airockchip/rknn_model_zoo</span><br>ONNX_MODEL = <span class="hljs-string">&#x27;/home/rk/vscode_ws/onnxrknn/0726.onnx&#x27;</span><br>RKNN_MODEL = <span class="hljs-string">&#x27;/home/rk/vscode_ws/onnxrknn/0726.rknn&#x27;</span><br>IMG_PATH = <span class="hljs-string">&#x27;/home/rk/vscode_ws/onnxrknn/2.jpg&#x27;</span><br>DATASET =  <span class="hljs-string">&#x27;/home/rk/vscode_ws/onnxrknn/yolov8n.txt&#x27;</span><br><br>QUANTIZE_ON = <span class="hljs-literal">True</span><br><br>OBJ_THRESH = <span class="hljs-number">0.25</span><br>NMS_THRESH = <span class="hljs-number">0.45</span><br>IMG_SIZE = <span class="hljs-number">640</span><br><br>CLASSES = (<br>        <span class="hljs-string">&quot;s&quot;</span><br>        )<br><br><span class="hljs-keyword">def</span> <span class="hljs-title function_">xywh2xyxy</span>(<span class="hljs-params">x</span>):<br>    <span class="hljs-comment"># Convert [x, y, w, h] to [x1, y1, x2, y2]</span><br>    y = np.copy(x)<br>    y[:, <span class="hljs-number">0</span>] = x[:, <span class="hljs-number">0</span>] - x[:, <span class="hljs-number">2</span>] / <span class="hljs-number">2</span>  <span class="hljs-comment"># top left x</span><br>    y[:, <span class="hljs-number">1</span>] = x[:, <span class="hljs-number">1</span>] - x[:, <span class="hljs-number">3</span>] / <span class="hljs-number">2</span>  <span class="hljs-comment"># top left y</span><br>    y[:, <span class="hljs-number">2</span>] = x[:, <span class="hljs-number">0</span>] + x[:, <span class="hljs-number">2</span>] / <span class="hljs-number">2</span>  <span class="hljs-comment"># bottom right x</span><br>    y[:, <span class="hljs-number">3</span>] = x[:, <span class="hljs-number">1</span>] + x[:, <span class="hljs-number">3</span>] / <span class="hljs-number">2</span>  <span class="hljs-comment"># bottom right y</span><br>    <span class="hljs-keyword">return</span> y<br><br><span class="hljs-keyword">def</span> <span class="hljs-title function_">process</span>(<span class="hljs-params"><span class="hljs-built_in">input</span>, mask, anchors</span>):<br><br>    anchors = [anchors[i] <span class="hljs-keyword">for</span> i <span class="hljs-keyword">in</span> mask]<br>    grid_h, grid_w = <span class="hljs-built_in">map</span>(<span class="hljs-built_in">int</span>, <span class="hljs-built_in">input</span>.shape[<span class="hljs-number">0</span>:<span class="hljs-number">2</span>])<br><br>    box_confidence = <span class="hljs-built_in">input</span>[..., <span class="hljs-number">4</span>]<br>    box_confidence = np.expand_dims(box_confidence, axis=-<span class="hljs-number">1</span>)<br><br>    box_class_probs = <span class="hljs-built_in">input</span>[..., <span class="hljs-number">5</span>:]<br><br>    box_xy = <span class="hljs-built_in">input</span>[..., :<span class="hljs-number">2</span>]*<span class="hljs-number">2</span> - <span class="hljs-number">0.5</span><br><br>    col = np.tile(np.arange(<span class="hljs-number">0</span>, grid_w), grid_w).reshape(-<span class="hljs-number">1</span>, grid_w)<br>    row = np.tile(np.arange(<span class="hljs-number">0</span>, grid_h).reshape(-<span class="hljs-number">1</span>, <span class="hljs-number">1</span>), grid_h)<br>    col = col.reshape(grid_h, grid_w, <span class="hljs-number">1</span>, <span class="hljs-number">1</span>).repeat(<span class="hljs-number">3</span>, axis=-<span class="hljs-number">2</span>)<br>    row = row.reshape(grid_h, grid_w, <span class="hljs-number">1</span>, <span class="hljs-number">1</span>).repeat(<span class="hljs-number">3</span>, axis=-<span class="hljs-number">2</span>)<br>    grid = np.concatenate((col, row), axis=-<span class="hljs-number">1</span>)<br>    box_xy += grid<br>    box_xy *= <span class="hljs-built_in">int</span>(IMG_SIZE/grid_h)<br><br>    box_wh = <span class="hljs-built_in">pow</span>(<span class="hljs-built_in">input</span>[..., <span class="hljs-number">2</span>:<span class="hljs-number">4</span>]*<span class="hljs-number">2</span>, <span class="hljs-number">2</span>)<br>    box_wh = box_wh * anchors<br><br>    box = np.concatenate((box_xy, box_wh), axis=-<span class="hljs-number">1</span>)<br><br>    <span class="hljs-keyword">return</span> box, box_confidence, box_class_probs<br><br><br><span class="hljs-keyword">def</span> <span class="hljs-title function_">filter_boxes</span>(<span class="hljs-params">boxes, box_confidences, box_class_probs</span>):<br>    <span class="hljs-string">&quot;&quot;&quot;Filter boxes with box threshold. It&#x27;s a bit different with origin yolov5 post process!</span><br><span class="hljs-string"></span><br><span class="hljs-string">    # Arguments</span><br><span class="hljs-string">        boxes: ndarray, boxes of objects.</span><br><span class="hljs-string">        box_confidences: ndarray, confidences of objects.</span><br><span class="hljs-string">        box_class_probs: ndarray, class_probs of objects.</span><br><span class="hljs-string"></span><br><span class="hljs-string">    # Returns</span><br><span class="hljs-string">        boxes: ndarray, filtered boxes.</span><br><span class="hljs-string">        classes: ndarray, classes for boxes.</span><br><span class="hljs-string">        scores: ndarray, scores for boxes.</span><br><span class="hljs-string">    &quot;&quot;&quot;</span><br>    boxes = boxes.reshape(-<span class="hljs-number">1</span>, <span class="hljs-number">4</span>)<br>    box_confidences = box_confidences.reshape(-<span class="hljs-number">1</span>)<br>    box_class_probs = box_class_probs.reshape(-<span class="hljs-number">1</span>, box_class_probs.shape[-<span class="hljs-number">1</span>])<br><br>    _box_pos = np.where(box_confidences &gt;= OBJ_THRESH)<br>    boxes = boxes[_box_pos]<br>    box_confidences = box_confidences[_box_pos]<br>    box_class_probs = box_class_probs[_box_pos]<br><br>    class_max_score = np.<span class="hljs-built_in">max</span>(box_class_probs, axis=-<span class="hljs-number">1</span>)<br>    classes = np.argmax(box_class_probs, axis=-<span class="hljs-number">1</span>)<br>    _class_pos = np.where(class_max_score &gt;= OBJ_THRESH)<br><br>    boxes = boxes[_class_pos]<br>    classes = classes[_class_pos]<br>    scores = (class_max_score* box_confidences)[_class_pos]<br><br>    <span class="hljs-keyword">return</span> boxes, classes, scores<br><br><br><span class="hljs-keyword">def</span> <span class="hljs-title function_">nms_boxes</span>(<span class="hljs-params">boxes, scores</span>):<br>    <span class="hljs-string">&quot;&quot;&quot;Suppress non-maximal boxes.</span><br><span class="hljs-string"></span><br><span class="hljs-string">    # Arguments</span><br><span class="hljs-string">        boxes: ndarray, boxes of objects.</span><br><span class="hljs-string">        scores: ndarray, scores of objects.</span><br><span class="hljs-string"></span><br><span class="hljs-string">    # Returns</span><br><span class="hljs-string">        keep: ndarray, index of effective boxes.</span><br><span class="hljs-string">    &quot;&quot;&quot;</span><br>    x = boxes[:, <span class="hljs-number">0</span>]<br>    y = boxes[:, <span class="hljs-number">1</span>]<br>    w = boxes[:, <span class="hljs-number">2</span>] - boxes[:, <span class="hljs-number">0</span>]<br>    h = boxes[:, <span class="hljs-number">3</span>] - boxes[:, <span class="hljs-number">1</span>]<br><br>    areas = w * h<br>    order = scores.argsort()[::-<span class="hljs-number">1</span>]<br><br>    keep = []<br>    <span class="hljs-keyword">while</span> order.size &gt; <span class="hljs-number">0</span>:<br>        i = order[<span class="hljs-number">0</span>]<br>        keep.append(i)<br><br>        xx1 = np.maximum(x[i], x[order[<span class="hljs-number">1</span>:]])<br>        yy1 = np.maximum(y[i], y[order[<span class="hljs-number">1</span>:]])<br>        xx2 = np.minimum(x[i] + w[i], x[order[<span class="hljs-number">1</span>:]] + w[order[<span class="hljs-number">1</span>:]])<br>        yy2 = np.minimum(y[i] + h[i], y[order[<span class="hljs-number">1</span>:]] + h[order[<span class="hljs-number">1</span>:]])<br><br>        w1 = np.maximum(<span class="hljs-number">0.0</span>, xx2 - xx1 + <span class="hljs-number">0.00001</span>)<br>        h1 = np.maximum(<span class="hljs-number">0.0</span>, yy2 - yy1 + <span class="hljs-number">0.00001</span>)<br>        inter = w1 * h1<br><br>        ovr = inter / (areas[i] + areas[order[<span class="hljs-number">1</span>:]] - inter)<br>        inds = np.where(ovr &lt;= NMS_THRESH)[<span class="hljs-number">0</span>]<br>        order = order[inds + <span class="hljs-number">1</span>]<br>    keep = np.array(keep)<br>    <span class="hljs-keyword">return</span> keep<br><br><span class="hljs-keyword">def</span> <span class="hljs-title function_">dfl</span>(<span class="hljs-params">position</span>):<br>    <span class="hljs-comment"># Distribution Focal Loss (DFL)</span><br>    <span class="hljs-keyword">import</span> torch<br>    x = torch.tensor(position)<br>    n,c,h,w = x.shape<br>    p_num = <span class="hljs-number">4</span><br>    mc = c/ er">3</span>]] -= dh  <span class="hljs-comment"># 减去高度方向的填充</span><br>                boxes[:, :<span class="hljs-number">4</span>] /= ratio[<span class="hljs-number">0</span>]  <span class="hljs-comment"># 缩放到原始切片尺寸</span><br><br>                <span class="hljs-comment"># 将切片坐标转换为原始图像坐标</span><br>                boxes[:, [<span class="hljs-number">0</span>, <span class="hljs-number">2</span>]] += x_min_slice<br>                boxes[:, [<span class="hljs-number">1</span>, <span class="hljs-number">3</span>]] += y_min_slice<br><br>                <span class="hljs-comment"># 确保坐标不超出原始图像范围</span><br>                boxes[:, [<span class="hljs-number">0</span>, <span class="hljs-number">2</span>]] = boxes[:, [<span class="hljs-number">0</span>, <span class="hljs-number">2</span>]].clip(<span class="hljs-number">0</span>, original_w)<br>                boxes[:, [<span class="hljs-number">1</span>, <span class="hljs-number">3</span>]] = boxes[:, [<span class="hljs-number">1</span>, <span class="hljs-number">3</span>]].clip(<span class="hljs-number">0</span>, original_h)<br>                <br>                all_frame_boxes.append(boxes)<br>                all_frame_classes.append(classes)<br>                all_frame_scores.append(scores)<br>        <br>        <span class="hljs-comment"># 2. 合并所有切片的检测结果并绘制到原始帧上</span><br>        <span class="hljs-keyword">if</span> all_frame_boxes:<br>            merged_frame = merge_and_draw_results(frame, all_frame_boxes, all_frame_classes, all_frame_scores)<br>        <span class="hljs-keyword">else</span>:<br>            merged_frame = frame.copy()<br><br>        <span class="hljs-comment"># 3. 将处理后的帧写入输出视频</span><br>        out.write(merged_frame)<br><br>        <span class="hljs-comment"># 可选：显示预览</span><br>        <span class="hljs-comment"># if display:</span><br>        <span class="hljs-comment">#     cv2.imshow(&#x27;Video Stream Inference&#x27;, merged_frame)</span><br>        <span class="hljs-comment">#     if cv2.wai
